---
# SDL for running the game on Akash. See "Deploy to Akash" in the README.
# The image tag matches the git tag of the release (vX.Y.Z).
version: "2.0"
services:
  game:
    image: sparkdreamnft/battle-royale:v1.0.1
    expose:
      - port: 2567
        as: 80
        proto: tcp
        to:
          - global: true
        accept:
          - battle.sparkdream.io   # proxied through Cloudflare for HTTPS
    env:
      - "NODE_ENV=production"
      - "PORT=2567"
      - "MAX_ROOMS=10"
      # Web3 (Spark Dream devnet). CHAIN_MNEMONIC is the relayer account: a
      # funded key that is an active x/rep member (it creates the game's
      # artifact classes and signs every match write). Inject it as a secret,
      # never commit it. Without CHAIN_ENABLED the game runs without web3.
      - "CHAIN_ENABLED=1"
      - "CHAIN_RPC=https://rpc-dev.sparkdream.io"
      - "CHAIN_LCD=https://api-dev.sparkdream.io"
      - "CHAIN_ID=sparkdream-dev-1"
      - "CHAIN_DENOM=usparz.sparkdreamdev"
      - "PUBLIC_URL=https://battle.sparkdream.io"   # base of match token uris
      # - "CHAIN_MNEMONIC=<secret>"
    params:
      storage:
        # The profile database. Survives restarts and updates, not closing the lease.
        data:
          mount: /app/data
          readOnly: false
profiles:
  compute:
    game:
      resources:
        cpu:
          units: 1
        memory:
          size: 1Gi
        storage:
          - size: 1Gi
          - name: data
            size: 1Gi
            attributes:
              persistent: true
              class: beta3
  placement:
    dcloud:
      pricing:
        game:
          denom: uact
          amount: 10000
deployment:
  game:
    dcloud:
      profile: game
      count: 1
